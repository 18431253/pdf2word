name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install flask pymupdf python-docx easyocr Pillow werkzeug

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onedir --console `
            --name "PDF转Word" `
            --add-data "templates;templates" `
            --hidden-import converter `
            --hidden-import fitz `
            --hidden-import docx `
            --hidden-import easyocr `
            --hidden-import PIL `
            --hidden-import numpy `
            --hidden-import cv2 `
            gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF转Word-Windows
          path: dist/PDF转Word/
          retention-days: 30
